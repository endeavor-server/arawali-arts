services:
  web:
    image: nginx:alpine
    container_name: arawali-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./server/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - lead-api

  lead-api:
    image: python:3.12-alpine
    container_name: arawali-lead-api
    restart: unless-stopped
    command: python /app/lead_api.py
    environment:
      - DATA_DIR=/data
      - ADMIN_TOKEN=${ARAWALI_ADMIN_TOKEN:-change-me}
    volumes:
      - ./server:/app:ro
      - ./leads:/data
